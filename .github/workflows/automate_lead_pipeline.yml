name: Refresh Lead Pipeline

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore resumable pipeline state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: lead-pipeline-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            lead-pipeline-${{ github.ref }}-

      - name: Refresh lead data
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID || 'apify/website-scraper' }}
          HIGH_INCOME_ZIPS: ${{ vars.HIGH_INCOME_ZIPS }}
          LEAD_SEARCH_TERM: ${{ vars.LEAD_SEARCH_TERM }}
          ZIP_DATASET_PATH: datasets/zips.txt
          LEAD_NICHES: ${{ vars.LEAD_NICHES || 'general' }}
          DRY_RUN: 'true'
        run: npm run pipeline

      - name: Persist resumable pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: lead-pipeline-${{ github.ref }}-${{ github.run_id }}
