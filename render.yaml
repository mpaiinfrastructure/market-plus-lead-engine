services:
  - type: web
    name: market-plus-engine-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DRY_RUN
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: DASHBOARD_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_ALLOWED_LOGIN
        value: mpaiinfrastructure
      - key: GITHUB_OAUTH_CALLBACK_URL
        sync: false
      - key: GITHUB_SESSION_SECRET
        generateValue: true
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_ACTOR_ID
        value: apify/website-scraper
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: SIGNALWIRE_SPACE
        sync: false
      - key: SIGNALWIRE_PROJECT_ID
        sync: false
      - key: SIGNALWIRE_API_TOKEN
        sync: false
      - key: SIGNALWIRE_PHONE_NUMBER
        sync: false
      - key: PIPELINE_LEAD_CAP
        value: "200"
      - key: PIPELINE_PAUSE_MS
        value: "14400000"
      - key: PIPELINE_CONCURRENCY
        value: "4"
    disk:
      name: market-plus-engine-data
      mountPath: /var/data
      sizeGB: 10

  - type: web
    name: market-plus-command-center
    runtime: node
    plan: starter
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
